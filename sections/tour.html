<section id="tour" class="tour">
  <div class="tour-inner">
    <h2 class="tour-heading reveal">A closer look inside MacBreeze.</h2>
    <div class="tour-layout">
      <div class="tour-tabs reveal" role="tablist" aria-label="App views">
        <button class="tour-tab active" data-tour="overview" role="tab" aria-selected="true">
          <span class="tour-tab-title">Overview</span>
          <span class="tour-tab-desc">Live temps, fan RPMs, and mode — all in one glance.</span>
        </button>
        <button class="tour-tab" data-tour="profiles" role="tab" aria-selected="false">
          <span class="tour-tab-title">Profiles</span>
          <span class="tour-tab-desc">Named speed presets you can switch between instantly.</span>
        </button>
        <button class="tour-tab" data-tour="automations" role="tab" aria-selected="false">
          <span class="tour-tab-title">App Automations</span>
          <span class="tour-tab-desc">Drop in an app, set its fan behavior, done.</span>
        </button>
        <button class="tour-tab" data-tour="safety" role="tab" aria-selected="false">
          <span class="tour-tab-title">Safety</span>
          <span class="tour-tab-desc">Auto-Blast trigger and overheat alerts, tuned to your taste.</span>
        </button>
        <button class="tour-tab" data-tour="preferences" role="tab" aria-selected="false">
          <span class="tour-tab-title">Preferences</span>
          <span class="tour-tab-desc">Units, menu bar display, and startup behavior.</span>
        </button>
      </div>
      <div class="tour-viewer reveal d2">
        <img src="images/tour-overview.png" alt="MacBreeze Overview tab showing live CPU, GPU, battery, and Wi-Fi temperatures, power draw, and an editable temperature-to-speed fan curve with linked left and right fans" class="tour-image" data-tour-image="overview">
        <img src="images/tour-profiles.png" alt="MacBreeze Profiles tab showing Default, Quiet, and AI - LLM speed profiles" class="tour-image" data-tour-image="profiles" hidden>
        <img src="images/tour-automations.png" alt="MacBreeze App Automations tab showing DaVinci Resolve and Affinity with per-app fan behavior" class="tour-image" data-tour-image="automations" hidden>
        <img src="images/tour-safety.png" alt="MacBreeze Safety tab showing the Auto-Blast trigger temperature and overheat notification settings" class="tour-image" data-tour-image="safety" hidden>
        <img src="images/tour-preferences.png" alt="MacBreeze Preferences tab showing temperature units, menu bar display, and startup options" class="tour-image" data-tour-image="preferences" hidden>
      </div>
    </div>
  </div>
</section>
